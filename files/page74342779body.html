    html,body { margin:0; height:100%; background:#000; overflow:hidden; }
    canvas { display:block; width:100%; height:100%; }
  </style> </head> <body> <canvas id="c"></canvas> <script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d', { alpha:false });

function resize(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  canvas.width  = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize', resize, {passive:true});
resize();

const rand = (a,b)=>a + Math.random()*(b-a);

const W = {
  count: 6,
  step: 5,
  bg: '#000'
};

const waves = Array.from({length: W.count}, (_,i)=>({
  amp: rand(25, 60),
  freq: rand(0.004, 0.018),
  speed: rand(0.6, 1.2),
  phase: Math.random()*Math.PI*2,
  jitter1: rand(1, 2.5),
  jitter2: rand(0.8, 2.0),
  width: rand(2, 4),
  hueShift: rand(0,360)
}));

let t = 0;

function draw(){
  t += 0.016;

  ctx.fillStyle = W.bg;
  ctx.fillRect(0,0,innerWidth,innerHeight);

  const gap = innerHeight / (W.count + 1);

  for(let i=0;i<waves.length;i++){
    const w = waves[i];
    const baseY = (i+1)*gap;

    const hue = (t*40 + w.hueShift) % 360;
    const grad = ctx.createLinearGradient(0,0,innerWidth,0);
    grad.addColorStop(0, `hsla(${hue},100%,65%,0.9)`);
    grad.addColorStop(0.5, `hsla(${(hue+120)%360},100%,55%,0.9)`);
    grad.addColorStop(1, `hsla(${(hue+240)%360},100%,65%,0.9)`);

    ctx.strokeStyle = grad;
    ctx.shadowColor = `hsla(${hue},100%,70%,0.8)`;
    ctx.shadowBlur = 25;
    ctx.lineWidth = w.width;

    ctx.beginPath();
    for(let x=0; x<=innerWidth; x+=W.step){
      const main = Math.sin(x*w.freq + t*w.speed + w.phase) * w.amp;
      const shake = Math.sin(x*0.08 + t*3 + w.phase)*w.jitter1
                  + Math.sin(x*0.21 - t*2.2 + w.phase*0.7)*w.jitter2;
      const y = baseY + main + shake;
      if (x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
  }

  requestAnimationFrame(draw);
}
draw();

// Тап/клик — меняем фазы
addEventListener('click', ()=>{
  for (let w of waves) {
    w.phase = Math.random()*Math.PI*2;
    w.hueShift = rand(0,360);
  }
});
</script> </body> </html> <!-- nominify end --> </div> </div> </div> </div> </div> <!--/allrecords-->
